schema:
  # The ent.graphql schema was generated by Ent.
  - ent.graphql
  - dct.graphql
  - extended.graphql
  

resolver:
  layout: follow-schema
  preserve_resolver: false
  dir: .

autobind:
  # Fix binding for the `Field` interface.
  - github.com/99designs/gqlgen/graphql/introspection
  - github.com/cobbleopolis/dragoncontimer/ent
  # Auto-bind the generated `Status` enum to GraphQL.
  - github.com/cobbleopolis/dragoncontimer/ent/station

# Disable the generated getters for all models and interfaces.
omit_getters: true
models:
  ID:
    model:
      - github.com/cobbleopolis/dragoncontimer/ent/schema/uuidgql.UUID
  Uint64:
    model:
      - github.com/99designs/gqlgen/graphql.Uint64
  Duration:
    model:
      - entgo.io/contrib/entgql/internal/todo/ent/schema/durationgql.Duration
  Map:
    model:
      - github.com/99designs/gqlgen/graphql.Map
  Node:
    model:
      - github.com/cobbleopolis/dragoncontimer/ent.Noder
  # BookmarkItem:
  #   model:
  #     - entgo.io/contrib/entgql/internal/todo/ent.BookmarkItem
  # BookmarkItemConnection:
  #   model:
  #     - entgo.io/contrib/entgql/internal/todo/ent.BookmarkItemConnection
  # BookmarkItemEdge:
  #   model:
  #     - entgo.io/contrib/entgql/internal/todo/ent.BookmarkItemEdge
  # Custom mapping from GraphQL `CategoryConfig` and
  # `CategoryConfigInput` to `schematype.CategoryConfig`.
  # CategoryConfig:
  #   model:
  #     - entgo.io/contrib/entgql/internal/todo/ent/schema/schematype.CategoryConfig
  # CategoryConfigInput:
  #   model:
  #     - entgo.io/contrib/entgql/internal/todo/ent/schema/schematype.CategoryConfig
  # CategoryTypes:
  #   model:
  #     - entgo.io/contrib/entgql/internal/todo/ent/schema/schematype.CategoryTypes
  # CategoryTypesInput:
  #   model:
  #     - entgo.io/contrib/entgql/internal/todo/ent/schema/schematype.CategoryTypes
  UUID:
    model:
      - entgo.io/contrib/entgql/internal/todouuid/ent/schema/uuidgql.UUID
